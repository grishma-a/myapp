    <script>
        // Copy the same mobile navigation JavaScript from your main file
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const closeMenu = document.getElementById('closeMenu');

        function toggleMobileMenu() {
            hamburger.classList.toggle('active');
            mobileNav.classList.toggle('active');
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        }

        if (hamburger) hamburger.addEventListener('click', toggleMobileMenu);
        if (closeMenu) closeMenu.addEventListener('click', toggleMobileMenu);
        if (mobileOverlay) mobileOverlay.addEventListener('click', toggleMobileMenu);

        document.querySelectorAll('.mobile-nav-list a').forEach(link => {
            link.addEventListener('click', toggleMobileMenu);
        });

        /* --- resume download (unchanged) --- */
        document.getElementById('resumeDownload').addEventListener('click', function () {

            link.click();

        });
