<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education - Grishma Shrestha</title>
    <link rel="icon" type="image/png" href="../gsinitials.png"> <!-- UPDATED -->
    <link rel="stylesheet" href="../src/index.css"> <!-- UPDATED -->
    <link rel="stylesheet" href="../src/styles/education.css"> <!-- UPDATED -->
    <script src="../src/navbar/load-navbar.js" defer></script>
</head>

<body>



    <!-- Education Section -->
    <section id="education" class="education-page">

        <div class="education-container">
            <!-- Left side - Image -->
            <div class="education-image">
                <img src="../src/assets/lsuTower.webp" alt="LSU Tower" /> <!-- UPDATED -->
            </div>

            <!-- Right side - Content -->
            <div class="education-content">
                <h2>
                    LOUISIANA<br>
                    STATE<br>
                    UNIVERSITY
                </h2>

                <p class="degree">B.S. Computer Science</p>
                <p class="degree">B.S. Mathematics</p>

                <div class="divider-line"></div>

                <p class="degree">2022 - 2026</p>
                <p class="degree">GPA: 4.19 / 4.3</p>
            </div>
        </div>
    </section>

    <script>
        // Copy the same mobile navigation JavaScript from your main file
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobileNav');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const closeMenu = document.getElementById('closeMenu');

        function toggleMobileMenu() {
            hamburger.classList.toggle('active');
            mobileNav.classList.toggle('active');
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
        }

        if (hamburger) hamburger.addEventListener('click', toggleMobileMenu);
        if (closeMenu) closeMenu.addEventListener('click', toggleMobileMenu);
        if (mobileOverlay) mobileOverlay.addEventListener('click', toggleMobileMenu);

        document.querySelectorAll('.mobile-nav-list a').forEach(link => {
            link.addEventListener('click', toggleMobileMenu);
        });
    </script>
</body>

</html>
